name: SSR repro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repro:
    name: dev SSR probe (port 8080)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: bun install --frozen-lockfile
      - name: Dev SSR probe on :8080
        run: |
          rm -f verdict.txt
          nohup bun run dev > dev.log 2>&1 &
          ok=""
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/" || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "DEV: no answer on :8080" >> verdict.txt
          else
            echo "DEV home=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" >> verdict.txt
            echo "DEV settings=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/settings)" >> verdict.txt
            echo "SETTINGS-BODY: $(curl -s http://localhost:8080/settings | head -c 500 | tr '\n' ' ')" >> verdict.txt
            echo "HOME-BODY: $(curl -s http://localhost:8080/ | head -c 300 | tr '\n' ' ')" >> verdict.txt
          fi
      - name: Commit output
        run: |
          { cat verdict.txt 2>/dev/null; echo; echo "## dev.log (full)"; cat dev.log; } > repro-output.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repro-output.md
          git commit -m "ci: ssr repro output [skip ci]"
          git push
