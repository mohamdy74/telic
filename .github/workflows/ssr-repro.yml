name: SSR repro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repro:
    name: vite build + dev SSR probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: bun install --frozen-lockfile
      - name: Vite build (mirrors the Lovable deploy build)
        run: |
          if npm run build > build.log 2>&1; then
            echo "BUILD: PASSED" > verdict.txt
          else
            echo "BUILD: FAILED (exit $?)" > verdict.txt
          fi
          cat verdict.txt
      - name: Dev SSR probe
        run: |
          nohup bun run dev > dev.log 2>&1 &
          ok=""
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000/" || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "DEV: no answer on :3000" >> verdict.txt
          else
            echo "DEV home=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" >> verdict.txt
            echo "DEV settings=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/settings)" >> verdict.txt
            echo "SETTINGS-BODY: $(curl -s http://localhost:3000/settings | head -c 400 | tr '\n' ' ')" >> verdict.txt
          fi
      - name: Commit output
        run: |
          { cat verdict.txt; echo; echo "## build.log tail"; tail -n 80 build.log; echo; echo "## dev.log tail"; tail -n 80 dev.log; } > repro-output.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repro-output.md
          git commit -m "ci: ssr repro output [skip ci]"
          git push
