name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          set +e
          bun install > /tmp/bun-install.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=bun install failed::$(tail -c 700 /tmp/bun-install.log | tr '\n' ' ')"
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Lint
        run: npm run lint
        continue-on-error: true # TODO: make blocking after a prettier baseline pass

  workerd-smoke:
    name: workerd SSR smoke (production runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          set +e
          bun install > /tmp/bun-install.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=bun install failed::$(tail -c 700 /tmp/bun-install.log | tr '\n' ' ')"
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Serve with workerd and probe
        run: |
          cd .output
          nohup npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          cd ..
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8787/ || true)
            [ -n "$code" ] && [ "$code" != "000" ] && [ "$code" != "500" ] && break
            sleep 2
          done
          H=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8787/)
          S=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8787/settings)
          SW=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8787/sw.js)
          MF=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8787/manifest.webmanifest)
          SH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8787/_shell.html)
          echo "home=$H settings=$S sw=$SW manifest=$MF shell=$SH"
          if [ "$H" != "200" ] || [ "$S" != "200" ] || [ "$SW" != "200" ] || [ "$MF" != "200" ] || [ "$SH" != "200" ]; then
            tail -n 60 .output/wrangler.log
            exit 1
          fi
